# development: local defaults; override with the environment
graphrd.repository=demo
quarkus.rest-client.graphrd.url=${GRAPHRD_URL:http://localhost:7200}

# GraphRD's PostgreSQL wire protocol; the database name is the repository id.
# With authentication off (`graphrd serve`), the user name is not checked.
quarkus.datasource.jdbc.url=${GRAPHRD_SQL_URL:jdbc:postgresql://localhost:5432/demo}
quarkus.datasource.username=graphrd
quarkus.datasource.password=

# production: no local fallback — the environment must say where the server is
%prod.quarkus.rest-client.graphrd.url=${GRAPHRD_URL}
%prod.quarkus.datasource.jdbc.url=${GRAPHRD_SQL_URL}
%prod.graphrd.repository=${GRAPHRD_REPOSITORY}
