name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep Defender away from the WAL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (default features, no TLS)
        run: cargo build --release --locked

      - name: Unit and integration tests
        run: cargo test --lib --release


  suites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: W3C suites (SPARQL, SHACL, RDF 1.2)
        run: |
          pip install rdflib
          git clone --depth 1 https://github.com/w3c/rdf-tests.git ../rdf-tests
          python3 tests/w3c/run.py ../rdf-tests

      - name: Docs examples check
        run: python3 tests/docs/check_examples.py target/release/graphrd

  tls-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tls-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tls-

      - name: Build with the TLS feature
        run: cargo build --release --locked --features tls

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings visible, not gating yet)
        run: cargo clippy --lib || true


  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, suites, tls-build, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep Defender away from the WAL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tls-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tls-

      - name: Build (with the tls feature)
        run: cargo build --release --locked --features tls

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          target="$(rustc -vV | sed -n 's/^host: //p')"
          dir="graphrd-${GITHUB_REF_NAME}-${target}"
          mkdir "${dir}"
          cp target/release/graphrd LICENSE README.md "${dir}/"
          tar -czf "${dir}.tar.gz" "${dir}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = (rustc -vV | Select-String '^host: (.+)$').Matches[0].Groups[1].Value
          $dir = "graphrd-${env:GITHUB_REF_NAME}-${target}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/graphrd.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "${dir}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphrd-${{ matrix.os }}
          path: |
            graphrd-*.tar.gz
            graphrd-*.zip


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: graphrd-*
          merge-multiple: true

      - name: SHA256 checksums
        working-directory: dist
        run: sha256sum graphrd-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
